<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="/copa-dm14/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2da Copa DM14</title>
<meta name="description" content="Fixture de 128 jugadores de la 2da Copa DM14 · Club de Billares OK">
<link rel="icon" href="img/ok.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="img/ok.svg" alt="Club de Billares OK">
      <div>
        <h1>2da Copa <b>DM14</b></h1>
        <p>Club de Billares OK · 2da y 3ra categoría · <strong>$20’000.000</strong> en efectivo</p>
      </div>
    </div>
    <div class="chips" aria-label="Resumen">
      <span class="chip y"><b id="stRound">R128</b>en juego</span>
      <span class="chip"><b id="stAlive">128</b>vivos</span>
      <span class="chip"><b id="stPlayed">0</b>jugadas</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Sección">
      <button type="button" data-tab="fixture" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 5h5v4H3zM3 15h5v4H3zM8 7h3v10H8M11 12h4M15 10h6v4h-6z"/></svg>Fixture</button>
      <button type="button" data-tab="horarios" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Horarios</button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="q" placeholder="Buscar jugador…" aria-label="Buscar jugador"></label>
  </div>
</header>

<main>
  <p class="msg" id="msg" role="status"></p>
  <section id="pFixture"></section>
  <section id="pHorarios" hidden></section>

  <footer class="foot">
    <div class="notice">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffc20e" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="15" height="14" rx="2"/><path d="M3 9h15M7 3v4M14 3v4"/><circle cx="18" cy="17" r="4.2" fill="#050b17"/><path d="M18 15v2.2l1.4 1"/></svg>
      <span>Llegar con 15 minutos de <b>anterioridad y uniforme correspondiente</b> para evitar descalificación</span>
    </div>
    <div class="sponsors">
      <img src="logos/andykin.png" alt="Andykin Sports" onerror="this.hidden=true">
      <img src="logos/dm14.png" alt="DM14 Super Cloth" onerror="this.hidden=true">
      <img src="logos/drbillards.png" alt="DR Billards" onerror="this.hidden=true">
    </div>
  </footer>
</main>

<script>
(()=>{
const F=window.Fixture,$=id=>document.getElementById(id);
let st=null,source="",tab="fixture",query="";
try{tab=sessionStorage.getItem("dm14.tab")||tab}catch(e){}
const bk=F.bracket($("pFixture"));

function showTab(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  $("pFixture").hidden=tab!=="fixture";$("pHorarios").hidden=tab!=="horarios";
}
function draw(){
  if(!st)return;
  showTab();
  bk.update(st);
  F.timeline($("pHorarios"),st,{query});
  const s=F.stats(st),cur=F.ROUNDS.indexOf(s.round);
  $("stRound").textContent=s.left===0?"Fin":cur>=0?F.SHORT[cur]:"—";
  $("stAlive").textContent=s.alive;$("stPlayed").textContent=s.played;
}
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  tab=b.dataset.tab;try{sessionStorage.setItem("dm14.tab",tab)}catch(e){}
  showTab();if(tab==="fixture")bk.update(st);
});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value;bk.setQuery(query);F.timeline($("pHorarios"),st,{query})},180)});

async function refresh(first){
  try{
    const r=await F.loadState();
    const changed=JSON.stringify(r.state)!==JSON.stringify(st);
    st=r.state;source=r.source;
    if(changed||first)draw();
    $("msg").textContent=r.updated?"Actualizado "+new Date(r.updated).toLocaleString("es-CO",{weekday:"long",hour:"2-digit",minute:"2-digit"}):"";
    $("msg").classList.remove("err");
  }catch(e){
    if(first){$("msg").textContent="No se pudo cargar el fixture: "+e.message;$("msg").classList.add("err")}
  }
}
refresh(true);
setInterval(()=>{if(source==="nube"&&!document.hidden)refresh(false)},20000);
})();
</script>
</body>
</html>
